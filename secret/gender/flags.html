<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pride Flags</title>
<link rel="stylesheet" href="../../styles/main.css?v=21">
<link rel="stylesheet" href="gender.css?v=2">
</head>
<body>

<div class="gd-shell wide">
  <a class="gd-back" href="index.html">&larr; back to gender home</a>

  <div class="gd-hero">
    <h1>Pride Flags</h1>
    <p>A reference of common pride flags and what their colors represent. Rendered as simple color stripes - a few real flags also include a shape (chevron, triangle, circle), noted where relevant.</p>
  </div>

  <div id="flag-grid" class="pf-grid"></div>

</div>

<script src="pride-flags-data.js?v=1"></script>
<script>
  const grid = document.getElementById("flag-grid");
  grid.innerHTML = PRIDE_FLAGS.map(f => `
    <div class="pf-card">
      <div class="pf-swatch">
        <div class="pride-flag-render">
          ${f.colors.map(c => `<span style="background:${c}"></span>`).join("")}
        </div>
      </div>
      <div class="pf-body">
        <h3>${f.name}</h3>
        <p>${f.meaning}</p>
      </div>
    </div>
  `).join("");
</script>

</body>
</html>
