<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Guess | Gender</title>
<link rel="stylesheet" href="../../../styles/main.css?v=21">
<link rel="stylesheet" href="../gender.css?v=2">
</head>
<body>

<div class="gd-shell">
  <a class="gd-back" href="../index.html">&larr; back to gender home</a>

  <div class="game-header">
    <h1 style="font-family:var(--font-display); font-size:32px; text-align:center; margin:0 0 8px;">Flag Guess</h1>
    <p style="text-align:center; color:var(--ink-dim); font-size:14px; margin:0 0 20px;">Guess the pride flag. Wrong guesses show how many colors you share with the answer.</p>
  </div>

  <div id="win-badge" class="win-badge hidden">Nice one!</div>

  <div class="flag-viewport" id="flag-viewport"></div>
  <div id="attempts-left" class="attempts-left"></div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>

  <form id="guess-form" class="guess-form" autocomplete="off">
    <div class="autocomplete">
      <input
        id="guess-input"
        type="text"
        placeholder="Choose a flag"
        autocomplete="off"
        required>
      <div id="autocomplete-list" class="autocomplete-list hidden"></div>
    </div>
    <button type="submit">Guess</button>
    <button id="play-again" type="button" class="play-again">Play random</button>
  </form>

  <div id="guess-list" class="guess-list"></div>
</div>

<script src="../pride-flags-data.js?v=1"></script>
<script src="game.js?v=2"></script>
</body>
</html>
