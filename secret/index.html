<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<link rel="stylesheet" href="../styles/main.css?v=14">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }

  .gate {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 48px;
    width: min(360px, 92vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .gate-icon {
    font-size: 32px;
    margin-bottom: 20px;
    opacity: 0.6;
  }

  .gate-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    text-align: center;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .gate-input:focus { border-color: var(--accent); }
  .gate-input.shake {
    animation: gate-shake 0.35s ease;
    border-color: var(--danger);
  }
  @keyframes gate-shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    40%     { transform: translateX(8px); }
    60%     { transform: translateX(-5px); }
    80%     { transform: translateX(5px); }
  }

  .gate-btn {
    width: 100%;
    background: var(--ink);
    color: #14171c;
    border: none;
    border-radius: 8px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    padding: 12px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .gate-btn:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="gate">
  <div class="gate-icon">&#128274;</div>
  <input
    class="gate-input"
    id="pw"
    type="password"
    placeholder="password"
    autocomplete="off"
    spellcheck="false"
  >
  <button class="gate-btn" id="enter-btn">Enter</button>
</div>

<script>
  // Passwords are stored as SHA-256 hashes so the plain text
  // is never in the source code. Each hash maps to a URL to
  // redirect to. Add more entries here for more secret areas.
  const ROUTES = {
    "796d6929d6556a6a08e7cc99f4799f5487bfe36c206aade82a0a77c8dc88c76e": "side-questing/index.html",
    // add more: "sha256hashhere": "some-other-area/index.html",
  };

  async function sha256(str) {
    const buf = await crypto.subtle.digest(
      "SHA-256",
      new TextEncoder().encode(str)
    );
    return Array.from(new Uint8Array(buf))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function tryPassword() {
    const val = document.getElementById("pw").value;
    if (!val) return;
    const hash = await sha256(val.trim().toLowerCase());
    if (hash in ROUTES) {
      window.location.href = ROUTES[hash];
    } else {
      const input = document.getElementById("pw");
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      input.value = "";
      setTimeout(() => input.classList.remove("shake"), 400);
      input.focus();
    }
  }

  document.getElementById("enter-btn").addEventListener("click", tryPassword);
  document.getElementById("pw").addEventListener("keydown", e => {
    if (e.key === "Enter") tryPassword();
  });
</script>
</body>
</html>
