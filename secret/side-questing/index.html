<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Questing</title>
<link rel="stylesheet" href="../../styles/main.css?v=14">
<style>
  .sq-hero {
    padding: 64px 0 40px;
    text-align: center;
  }
  .sq-hero h1 {
    font-family: var(--font-display);
    font-size: 40px;
    margin: 0 0 10px;
  }
  .sq-hero p {
    color: var(--ink-dim);
    margin: 0;
    font-size: 15px;
  }

  .sq-shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    max-width: 700px;
    margin: 0 auto 48px;
  }

  .sq-card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s, background 0.15s;
    display: block;
  }
  .sq-card:hover { border-color: var(--accent); background: var(--bg-panel-hover); }

  .sq-card-icon { font-size: 28px; margin-bottom: 10px; }
  .sq-card-name {
    font-family: var(--font-display);
    font-size: 20px;
    margin: 0 0 6px;
  }
  .sq-card-desc {
    color: var(--ink-dim);
    font-size: 13px;
    margin: 0;
  }

  .sq-footer {
    text-align: center;
    padding-bottom: 40px;
  }
  .sq-lock-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    border-radius: 20px;
    padding: 7px 18px;
    cursor: pointer;
  }
  .sq-lock-btn:hover { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <div class="sq-hero">
    <h1>Side Questing</h1>
    <p>Your personal secret area.</p>
  </div>

  <div class="sq-shelf">
    <a class="sq-card" href="tracker/index.html">
      <div class="sq-card-icon">&#127918;</div>
      <div class="sq-card-name">Card Tracker</div>
      <p class="sq-card-desc">HP and ability tracker for the card game.</p>
    </a>
    <!-- Add more cards here for more tools inside Side Questing -->
  </div>

  <div class="sq-footer">
    <button class="sq-lock-btn" onclick="window.location.href='../index.html'">&#128274; Lock</button>
  </div>
</div>
</body>
</html>
