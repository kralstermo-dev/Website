<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Tracker | Side Questing</title>
<link rel="stylesheet" href="../../../styles/main.css?v=14">
<style>
/* ── layout ── */
.tr-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 16px 64px;
}
.tr-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0 24px;
  gap: 12px;
  flex-wrap: wrap;
}
.tr-header h1 {
  font-family: var(--font-display);
  font-size: 26px;
  margin: 0;
}
.tr-header-btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* ── turn banner ── */
.tr-turn {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.tr-turn-label {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink-dim);
}
.tr-turn-name {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--accent);
}
.tr-turn-btns { display: flex; gap: 8px; }

/* ── players grid ── */
.tr-players {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

/* ── player card ── */
.tr-player {
  background: var(--bg-panel);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  transition: border-color 0.2s;
  position: relative;
}
.tr-player.active-turn { border-color: var(--accent); }
.tr-player.knocked-out { opacity: 0.45; border-color: var(--danger); }

.tr-player-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 8px;
}
.tr-player-name {
  font-family: var(--font-display);
  font-size: 18px;
  margin: 0;
  cursor: pointer;
}
.tr-player-name:hover { color: var(--accent); }
.tr-player-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 20px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  white-space: nowrap;
}
.tr-player-badge.active-badge { border-color: var(--accent); color: var(--accent); }
.tr-player-badge.ko-badge { border-color: var(--danger); color: var(--danger); }

/* active card display */
.tr-active-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 14px;
}
.tr-active-card-label {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--ink-dim);
  margin-bottom: 4px;
}
.tr-active-card-name {
  font-family: var(--font-display);
  font-size: 16px;
  margin-bottom: 8px;
}
.tr-card-select {
  width: 100%;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 8px;
  cursor: pointer;
}

/* HP display */
.tr-hp-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.tr-hp-label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  min-width: 24px;
}
.tr-hp-num {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 700;
  min-width: 72px;
  text-align: center;
  cursor: pointer;
  border-radius: 6px;
  padding: 2px 6px;
  transition: background 0.1s;
}
.tr-hp-num:hover { background: var(--bg-panel-hover); }
.tr-hp-num.hp-high { color: var(--correct); }
.tr-hp-num.hp-mid  { color: var(--present); }
.tr-hp-num.hp-low  { color: var(--danger); }
.tr-hp-btns {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.tr-hp-btn {
  width: 32px; height: 28px;
  background: var(--bg-panel-hover);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, border-color 0.1s;
}
.tr-hp-btn:hover { border-color: var(--accent); background: var(--bg); }
.tr-hp-input-row {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.tr-hp-custom {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 6px 10px;
  outline: none;
}
.tr-hp-custom:focus { border-color: var(--accent); }
.tr-apply-btn {
  background: var(--bg-panel-hover);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 6px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.tr-apply-btn:hover { border-color: var(--accent); }

/* abilities */
.tr-abilities-label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  margin-bottom: 8px;
}
.tr-ability {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  transition: opacity 0.2s;
}
.tr-ability.used { opacity: 0.35; }
.tr-ability-info { flex: 1; }
.tr-ability-name {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
}
.tr-ability-type {
  font-size: 10px;
  color: var(--ink-dim);
}
.tr-ability-badge {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 10px;
  font-family: var(--font-mono);
  white-space: nowrap;
}
.badge-opg { background: #c96a4f33; color: var(--danger); border: 1px solid var(--danger); }
.badge-opt { background: #5fb87a22; color: var(--correct); border: 1px solid var(--correct); }
.badge-counter { background: #5fa8a022; color: var(--accent-2); border: 1px solid var(--accent-2); }
.tr-ability-toggle {
  background: none;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--ink-dim);
  font-size: 14px;
  width: 26px; height: 26px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.tr-ability-toggle:hover { border-color: var(--accent); color: var(--ink); }
.tr-ability.used .tr-ability-toggle { border-color: var(--danger); }

/* status effects */
.tr-status-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.tr-status-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--bg-panel-hover);
  border: 1px solid var(--line);
  cursor: pointer;
  display: flex; align-items: center; gap: 4px;
}
.tr-status-tag:hover { border-color: var(--danger); }
.tr-status-tag .remove { color: var(--danger); font-size: 12px; }
.tr-add-status {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 10px;
  background: none;
  border: 1px dashed var(--line);
  color: var(--ink-dim);
  cursor: pointer;
}
.tr-add-status:hover { border-color: var(--accent); color: var(--ink); }

/* ── log ── */
.tr-log {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.tr-log-title {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-dim);
  margin-bottom: 10px;
}
.tr-log-entries {
  max-height: 140px;
  overflow-y: auto;
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
}
.tr-log-entry {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-dim);
}
.tr-log-entry span { color: var(--ink); }

/* ── utility buttons ── */
.tr-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--line);
  background: var(--bg-panel);
  color: var(--ink);
  border-radius: 20px;
  padding: 8px 16px;
  cursor: pointer;
  white-space: nowrap;
}
.tr-btn:hover { border-color: var(--accent); }
.tr-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.tr-btn.primary { background: var(--accent); color: #14171c; border-color: var(--accent); }

/* ── add player form ── */
.tr-add-player {
  background: var(--bg-panel);
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
.tr-add-form {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 10px;
}
.tr-text-input {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 8px 12px;
  outline: none;
}
.tr-text-input:focus { border-color: var(--accent); }

/* ── hp edit modal ── */
.tr-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  display: none;
}
.tr-modal-overlay.open { display: flex; }
.tr-modal {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 28px 32px;
  min-width: 280px;
  text-align: center;
}
.tr-modal h3 {
  font-family: var(--font-display);
  margin: 0 0 16px;
}
.tr-modal input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 22px;
  padding: 10px;
  text-align: center;
  outline: none;
  margin-bottom: 14px;
}
.tr-modal input:focus { border-color: var(--accent); }
.tr-modal-btns { display: flex; gap: 8px; justify-content: center; }
</style>
</head>
<body>
<div class="tr-wrap">

  <!-- header -->
  <div class="tr-header">
    <div>
      <a class="back-link" href="../../index.html">&larr; side questing</a>
      <h1>Card Tracker</h1>
    </div>
    <div class="tr-header-btns">
      <button class="tr-btn" id="btn-next-turn">Next Turn ▶</button>
      <button class="tr-btn" id="btn-reset-turn">Reset Turn Abilities</button>
      <button class="tr-btn danger" id="btn-new-game">New Game</button>
    </div>
  </div>

  <!-- turn banner -->
  <div class="tr-turn">
    <div>
      <div class="tr-turn-label">Current Turn</div>
      <div class="tr-turn-name" id="turn-display">—</div>
    </div>
    <div class="tr-turn-btns">
      <button class="tr-btn" id="btn-prev-turn">◀ Prev</button>
      <div style="font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);display:flex;align-items:center;padding:0 4px;">Turn <span id="turn-count" style="color:var(--ink);margin-left:4px">1</span></div>
    </div>
  </div>

  <!-- players grid -->
  <div class="tr-players" id="players-grid"></div>

  <!-- add player -->
  <div class="tr-add-player" id="add-player-area">
    <div style="color:var(--ink-dim);font-size:13px;margin-bottom:4px">Add a player (up to 4)</div>
    <div class="tr-add-form">
      <input class="tr-text-input" id="new-player-name" placeholder="Player name..." maxlength="20">
      <button class="tr-btn primary" id="btn-add-player">Add Player</button>
    </div>
  </div>

  <!-- battle log -->
  <div class="tr-log" style="margin-top:20px">
    <div class="tr-log-title">Battle Log</div>
    <div class="tr-log-entries" id="log-entries">
      <div class="tr-log-entry" style="color:var(--ink-dim)">Game not started yet...</div>
    </div>
  </div>

</div>

<!-- HP edit modal -->
<div class="tr-modal-overlay" id="hp-modal">
  <div class="tr-modal">
    <h3 id="modal-title">Set HP</h3>
    <input type="number" id="modal-hp-input" min="0" max="9999">
    <div class="tr-modal-btns">
      <button class="tr-btn" id="modal-cancel">Cancel</button>
      <button class="tr-btn primary" id="modal-confirm">Set HP</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CARD DATA - add more cards here as you design them
// ============================================================
const CARDS = [
  {
    name: "Discord Mod",

    abilities: [
      { name: "Timeout", type: "counter", freq: "opg", desc: "Freeze a player — they skip their next turn" },

    ]
  },

    name: "Femboy",
    hp: 80,
    abilities: [
      { name: "Trick", type: "passive", freq: "opg", desc: "Trick a male card — deal a critical 30 HP to them" },
      { name: "White Monster", type: "buff", freq: "opt", desc: "Deal 10 extra HP OR play 2 attacks next round" },
      { name: "Blåhaj Hit", type: "attack", freq: "opt", desc: "Deal 20 HP" },
      { name: ":3", type: "counter", freq: "opt", desc: "Next hit's damage is reduced by 30 HP" },
    ]
  },
  {
    name: "Regular Female",
    hp: 51,
    abilities: [
      { name: "Flirt", type: "passive", freq: "opg", desc: "Tries flirting with a targeted card (effect TBD)" },
      { name: "Clean", type: "attack", freq: "opt", desc: "10 HP damage" },
      { name: "Mom Time", type: "heal", freq: "opt", desc: "Heal 30 HP — cannot be used next turn", cooldown: 2 },
    ]
  },
  {
    name: "Lesbian Girl",
    hp: 65,
    abilities: [
      { name: "Detect Gays", type: "passive", freq: "opg", desc: "All players must show if they have a 'gay' card" },
      { name: "Gayify", type: "attack", freq: "opt", desc: "30% chance to deal 30 HP; if already gay, deal 10 HP instead" },
      { name: "Kiss", type: "attack", freq: "opt", desc: "Only works on 'women' — deals 15 HP, applies Shocked" },
      { name: "Scissor", type: "heal", freq: "opt", desc: "Only works on woman — heals 10 HP" },
    ]
  },
  // Placeholder cards - abilities TBD
  { name: "Regular Dude",    hp: 55,  abilities: [] },
  { name: "Drunk Guy",       hp: 65,  abilities: [] },
  { name: "Furry",           hp: 60,  abilities: [] },
  { name: "DnD Nerd",        hp: 90,  abilities: [] },
  { name: "Muilwijk",        hp: 80,  abilities: [] },
  { name: "Burg Wijf",       hp: 75,  abilities: [] },
  { name: "Swimming Guy",    hp: 70,  abilities: [] },
  { name: "Adolf H.",        hp: 120, abilities: [] },
  { name: "Woonboot Eigenaar", hp: 100, abilities: [] },
  { name: "Sans",            hp: 1,   abilities: [] },
  { name: "Flowy",           hp: 250, abilities: [] },
  { name: "Asoshave Fetbiker", hp: 90, abilities: [] },
  { name: "Postbode",        hp: 95,  abilities: [] },
  { name: "Jumbo Tiener",    hp: 60,  abilities: [] },

  { name: "Tiktok Tamo",    hp: 50,  abilities: [] },

  { name: "Putin",           hp: 180, abilities: [] },
  { name: "Kim Jong Un",     hp: 160, abilities: [] },
  { name: "Zelentski",       hp: 170, abilities: [] },

  { name: "Bald Guy",        hp: 70,  abilities: [] },
  { name: "Charlie Kirk",    hp: 80,  abilities: [] },
  { name: "Kriz",            hp: 85,  abilities: [] },
  { name: "Gamble",          hp: 55,  abilities: [] },
  { name: "Eric Cartman",    hp: 95,  abilities: [] },
  { name: "Good Boy",        hp: 60,  abilities: [] },
  { name: "Colorblind Guy",  hp: 65,  abilities: [] },
  { name: "Oma en Hond",     hp: 70,  abilities: [] },
  { name: "Rick",            hp: 120, abilities: [] },
  { name: "Morty",           hp: 55,  abilities: [] },
];

// ============================================================
// STATE
// ============================================================
let state = {
  players: [],       // { name, cardName, currentHp, maxHp, abilities, statuses, cooldowns }
  turnIndex: 0,
  turnCount: 1,
  log: [],
};

const MAX_PLAYERS = 4;
const STATUS_OPTIONS = ["Shocked", "Frozen", "Burned", "Poisoned", "Buffed", "Weakened", "Timed Out", "Gay"];

// ============================================================
// PERSISTENCE
// ============================================================
function saveState() {
  try { localStorage.setItem("sq-tracker", JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try {
    const s = localStorage.getItem("sq-tracker");
    if (s) state = JSON.parse(s);
  } catch(e) {}
}

// ============================================================
// LOGGING
// ============================================================
function addLog(msg) {
  state.log.unshift({ msg, turn: state.turnCount });
  if (state.log.length > 50) state.log.pop();
  renderLog();
  saveState();
}

function renderLog() {
  const el = document.getElementById("log-entries");
  if (!state.log.length) {
    el.innerHTML = '<div class="tr-log-entry" style="color:var(--ink-dim)">No events yet...</div>';
    return;
  }
  el.innerHTML = state.log.map(e =>
    `<div class="tr-log-entry">T${e.turn}: <span>${e.msg}</span></div>`
  ).join("");
}

// ============================================================
// CARD HELPERS
// ============================================================
function getCard(name) {
  return CARDS.find(c => c.name === name) || null;
}

function hpClass(current, max) {
  const pct = current / max;
  if (pct > 0.5) return "hp-high";
  if (pct > 0.25) return "hp-mid";
  return "hp-low";
}

function buildPlayerState(playerName, cardName) {
  const card = getCard(cardName);
  if (!card) return null;
  return {
    name: playerName,
    cardName,
    currentHp: card.hp,
    maxHp: card.hp,
    statuses: [],
    cooldowns: {},   // abilityName -> turnsRemaining
    usedOpg: {},     // abilityName -> true (once per game, never resets)
    usedOpt: {},     // abilityName -> true (once per turn, resets each turn)
  };
}

// ============================================================
// RENDER
// ============================================================
function render() {
  renderTurnBanner();
  renderPlayers();
  renderLog();
  const area = document.getElementById("add-player-area");
  area.style.display = state.players.length >= MAX_PLAYERS ? "none" : "block";
}

function renderTurnBanner() {
  const td = document.getElementById("turn-display");
  const tc = document.getElementById("turn-count");
  tc.textContent = state.turnCount;
  if (!state.players.length) { td.textContent = "—"; return; }
  const alive = state.players.filter(p => p.currentHp > 0);
  if (!alive.length) { td.textContent = "Game over!"; return; }
  const idx = state.turnIndex % alive.length;
  td.textContent = alive[idx].name;
}

function renderPlayers() {
  const grid = document.getElementById("players-grid");
  if (!state.players.length) {
    grid.innerHTML = "";
    return;
  }
  const alive = state.players.filter(p => p.currentHp > 0);
  const currentPlayer = alive.length ? alive[state.turnIndex % alive.length] : null;

  grid.innerHTML = state.players.map((player, pi) => {
    const card = getCard(player.cardName);
    const isActive = currentPlayer && player.name === currentPlayer.name && player.currentHp > 0;
    const isKo = player.currentHp <= 0;
    const hpCls = hpClass(player.currentHp, player.maxHp);
    const classStr = isKo ? "tr-player knocked-out" : isActive ? "tr-player active-turn" : "tr-player";
    const badge = isKo ? `<span class="tr-player-badge ko-badge">KO</span>`
                : isActive ? `<span class="tr-player-badge active-badge">YOUR TURN</span>`
                : `<span class="tr-player-badge">${player.currentHp > 0 ? "waiting" : "ko"}</span>`;

    const abilitiesHtml = card && card.abilities.length ? `
      <div class="tr-abilities-label">ABILITIES</div>
      ${card.abilities.map(ab => {
        const isOpg = ab.freq === "opg";
        const usedOpg = player.usedOpg && player.usedOpg[ab.name];
        const usedOpt = player.usedOpt && player.usedOpt[ab.name];
        const onCd = player.cooldowns && player.cooldowns[ab.name] > 0;
        const isUsed = usedOpg || usedOpt || onCd;
        const badgeHtml = isOpg
          ? `<span class="tr-ability-badge badge-opg">ONCE/GAME</span>`
          : ab.type === "counter"
          ? `<span class="tr-ability-badge badge-counter">COUNTER</span>`
          : `<span class="tr-ability-badge badge-opt">PER TURN</span>`;
        const cdNote = onCd ? ` (${player.cooldowns[ab.name]}t left)` : "";
        return `
          <div class="tr-ability ${isUsed ? "used" : ""}" data-pi="${pi}" data-ab="${ab.name}">
            <div class="tr-ability-info">
              <div class="tr-ability-name">${ab.name}${cdNote}</div>
              <div class="tr-ability-type">${ab.desc || ""}</div>
            </div>
            ${badgeHtml}
            <button class="tr-ability-toggle" data-pi="${pi}" data-ab="${ab.name}" title="${isUsed ? "Mark available" : "Mark used"}">
              ${isUsed ? "✓" : "•"}
            </button>
          </div>
        `;
      }).join("")}
    ` : card && !card.abilities.length ? `<div style="font-size:12px;color:var(--ink-dim);font-family:var(--font-mono)">Abilities coming soon...</div>` : "";

    const statusHtml = `
      <div class="tr-status-row">
        ${(player.statuses || []).map(s => `
          <span class="tr-status-tag" data-pi="${pi}" data-status="${s}">
            ${s} <span class="remove" data-pi="${pi}" data-status="${s}">×</span>
          </span>
        `).join("")}
        <button class="tr-add-status" data-pi="${pi}">+ status</button>
      </div>
    `;

    const cardOptions = CARDS.map(c =>
      `<option value="${c.name}" ${c.name === player.cardName ? "selected" : ""}>${c.name} (${c.hp} HP)</option>`
    ).join("");

    return `
      <div class="${classStr}" id="player-${pi}">
        <div class="tr-player-top">
          <div class="tr-player-name" data-pi="${pi}">${player.name}</div>
          ${badge}
        </div>

        <div class="tr-active-card">
          <div class="tr-active-card-label">ACTIVE CARD</div>
          <div class="tr-active-card-name">${player.cardName}</div>
          <select class="tr-card-select" data-pi="${pi}">
            ${cardOptions}
          </select>
        </div>

        <div class="tr-hp-row">
          <div class="tr-hp-label">HP</div>
          <div class="tr-hp-num ${hpCls}" data-pi="${pi}">${isKo ? "KO" : player.currentHp}</div>
          <div class="tr-hp-btns">
            <button class="tr-hp-btn" data-pi="${pi}" data-delta="1">+</button>
            <button class="tr-hp-btn" data-pi="${pi}" data-delta="-1">−</button>
          </div>
          <div style="font-size:11px;color:var(--ink-dim);font-family:var(--font-mono)">${player.maxHp} max</div>
        </div>

        <div class="tr-hp-input-row">
          <input class="tr-hp-custom" type="number" placeholder="damage/heal..." data-pi="${pi}" min="-9999" max="9999">
          <button class="tr-apply-btn" data-pi="${pi}">Apply</button>
        </div>

        ${abilitiesHtml}
        ${statusHtml}

        <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">
          <button class="tr-btn" style="font-size:11px;padding:5px 10px;" data-pi="${pi}" data-action="retreat">Retreat</button>
          <button class="tr-btn danger" style="font-size:11px;padding:5px 10px;" data-pi="${pi}" data-action="remove">Remove Player</button>
        </div>
      </div>
    `;
  }).join("");

  attachPlayerEvents();
}

function attachPlayerEvents() {
  // card select
  document.querySelectorAll(".tr-card-select").forEach(el => {
    el.addEventListener("change", e => {
      const pi = +e.target.dataset.pi;
      const card = getCard(e.target.value);
      if (!card) return;
      const p = state.players[pi];
      const newP = buildPlayerState(p.name, card.name);
      state.players[pi] = newP;
      addLog(`${p.name} switched to ${card.name}`);
      render();
    });
  });

  // +/- 1 HP
  document.querySelectorAll(".tr-hp-btn").forEach(el => {
    el.addEventListener("click", e => {
      const pi = +e.currentTarget.dataset.pi;
      const delta = +e.currentTarget.dataset.delta;
      changeHp(pi, delta, delta > 0 ? "healed 1 HP" : "took 1 HP damage");
    });
  });

  // click HP number to set manually
  document.querySelectorAll(".tr-hp-num").forEach(el => {
    el.addEventListener("click", e => {
      const pi = +e.currentTarget.dataset.pi;
      openHpModal(pi);
    });
  });

  // custom damage/heal input
  document.querySelectorAll(".tr-apply-btn").forEach(el => {
    el.addEventListener("click", e => {
      const pi = +e.currentTarget.dataset.pi;
      const input = document.querySelector(`.tr-hp-custom[data-pi="${pi}"]`);
      const val = parseInt(input.value);
      if (isNaN(val)) return;
      changeHp(pi, val, val < 0 ? `took ${Math.abs(val)} HP damage` : `healed ${val} HP`);
      input.value = "";
    });
  });

  // ability toggles
  document.querySelectorAll(".tr-ability-toggle").forEach(el => {
    el.addEventListener("click", e => {
      const pi = +e.currentTarget.dataset.pi;
      const abName = e.currentTarget.dataset.ab;
      toggleAbility(pi, abName);
    });
  });

  // status remove
  document.querySelectorAll(".tr-status-tag .remove").forEach(el => {
    el.addEventListener("click", e => {
      const pi = +e.currentTarget.dataset.pi;
      const status = e.currentTarget.dataset.status;
      state.players[pi].statuses = state.players[pi].statuses.filter(s => s !== status);
      addLog(`${state.players[pi].name} lost status: ${status}`);
      render();
    });
  });

  // add status
  document.querySelectorAll(".tr-add-status").forEach(el => {
    el.addEventListener("click", e => {
      const pi = +e.currentTarget.dataset.pi;
      const status = prompt("Add status effect:\n" + STATUS_OPTIONS.join(", "));
      if (!status) return;
      if (!state.players[pi].statuses.includes(status)) {
        state.players[pi].statuses.push(status);
        addLog(`${state.players[pi].name} got status: ${status}`);
        render();
      }
    });
  });

  // action buttons (retreat, remove)
  document.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", e => {
      const pi = +e.currentTarget.dataset.pi;
      const action = e.currentTarget.dataset.action;
      if (action === "retreat") retreat(pi);
      if (action === "remove") removePlayer(pi);
    });
  });
}

// ============================================================
// GAME ACTIONS
// ============================================================
function changeHp(pi, delta, logMsg) {
  const p = state.players[pi];
  const oldHp = p.currentHp;
  p.currentHp = Math.max(0, Math.min(p.maxHp, p.currentHp + delta));
  addLog(`${p.name} (${p.cardName}): ${logMsg} → ${p.currentHp} HP`);
  if (oldHp > 0 && p.currentHp === 0) {
    addLog(`${p.name}'s ${p.cardName} is knocked out!`);
  }
  saveState();
  render();
}

function toggleAbility(pi, abName) {
  const p = state.players[pi];
  const card = getCard(p.cardName);
  const ab = card && card.abilities.find(a => a.name === abName);
  if (!ab) return;

  if (ab.freq === "opg") {
    p.usedOpg[abName] = !p.usedOpg[abName];
    addLog(`${p.name}: ${abName} marked ${p.usedOpg[abName] ? "USED (once/game)" : "available"}`);
  } else {
    p.usedOpt[abName] = !p.usedOpt[abName];
    if (ab.cooldown && p.usedOpt[abName]) {
      p.cooldowns[abName] = ab.cooldown;
    }
    addLog(`${p.name}: ${abName} marked ${p.usedOpt[abName] ? "used" : "available"}`);
  }
  saveState();
  render();
}

function retreat(pi) {
  const p = state.players[pi];
  const newCardName = prompt("Retreat — enter new card name:");
  if (!newCardName) return;
  const card = getCard(newCardName);
  if (!card) { alert("Card not found: " + newCardName); return; }
  const newP = buildPlayerState(p.name, card.name);
  state.players[pi] = newP;
  addLog(`${p.name} retreated and played ${card.name}`);
  render();
}

function removePlayer(pi) {
  if (!confirm(`Remove ${state.players[pi].name}?`)) return;
  addLog(`${state.players[pi].name} left the game`);
  state.players.splice(pi, 1);
  state.turnIndex = 0;
  saveState();
  render();
}

// ============================================================
// TURN MANAGEMENT
// ============================================================
function nextTurn() {
  const alive = state.players.filter(p => p.currentHp > 0);
  if (!alive.length) return;
  // reset per-turn abilities for the player whose turn just ended
  const currentPlayer = alive[state.turnIndex % alive.length];
  if (currentPlayer) {
    const card = getCard(currentPlayer.cardName);
    if (card) {
      card.abilities.forEach(ab => {
        if (ab.freq === "opt") currentPlayer.usedOpt[ab.name] = false;
        // tick down cooldowns
        if (currentPlayer.cooldowns[ab.name] > 0) {
          currentPlayer.cooldowns[ab.name]--;
        }
      });
    }
  }
  state.turnIndex = (state.turnIndex + 1) % alive.length;
  state.turnCount++;
  addLog(`--- Turn ${state.turnCount}: ${alive[state.turnIndex % alive.length].name} ---`);
  saveState();
  render();
}

function prevTurn() {
  const alive = state.players.filter(p => p.currentHp > 0);
  if (!alive.length) return;
  state.turnIndex = (state.turnIndex - 1 + alive.length) % alive.length;
  if (state.turnCount > 1) state.turnCount--;
  addLog(`Went back to turn ${state.turnCount}`);
  saveState();
  render();
}

function resetTurnAbilities() {
  state.players.forEach(p => {
    const card = getCard(p.cardName);
    if (!card) return;
    card.abilities.forEach(ab => {
      if (ab.freq === "opt") p.usedOpt[ab.name] = false;
    });
  });
  addLog("All once-per-turn abilities reset");
  saveState();
  render();
}

// ============================================================
// HP MODAL
// ============================================================
let modalTargetPi = null;
function openHpModal(pi) {
  modalTargetPi = pi;
  const p = state.players[pi];
  document.getElementById("modal-title").textContent = `Set HP — ${p.name} (${p.cardName})`;
  document.getElementById("modal-hp-input").value = p.currentHp;
  document.getElementById("hp-modal").classList.add("open");
  document.getElementById("modal-hp-input").focus();
}
document.getElementById("modal-cancel").addEventListener("click", () => {
  document.getElementById("hp-modal").classList.remove("open");
});
document.getElementById("modal-confirm").addEventListener("click", () => {
  const val = parseInt(document.getElementById("modal-hp-input").value);
  if (!isNaN(val) && modalTargetPi !== null) {
    const p = state.players[modalTargetPi];
    const old = p.currentHp;
    p.currentHp = Math.max(0, Math.min(p.maxHp, val));
    addLog(`${p.name} HP set to ${p.currentHp} (was ${old})`);
    saveState();
    render();
  }
  document.getElementById("hp-modal").classList.remove("open");
});
document.getElementById("modal-hp-input").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("modal-confirm").click();
  if (e.key === "Escape") document.getElementById("modal-cancel").click();
});

// ============================================================
// ADD PLAYER
// ============================================================
document.getElementById("btn-add-player").addEventListener("click", () => {
  if (state.players.length >= MAX_PLAYERS) return;
  const nameInput = document.getElementById("new-player-name");
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  const defaultCard = CARDS[0];
  const p = buildPlayerState(name, defaultCard.name);
  state.players.push(p);
  nameInput.value = "";
  addLog(`${name} joined with ${defaultCard.name}`);
  render();
});
document.getElementById("new-player-name").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("btn-add-player").click();
});

// ============================================================
// CONTROL BUTTONS
// ============================================================
document.getElementById("btn-next-turn").addEventListener("click", nextTurn);
document.getElementById("btn-prev-turn").addEventListener("click", prevTurn);
document.getElementById("btn-reset-turn").addEventListener("click", resetTurnAbilities);
document.getElementById("btn-new-game").addEventListener("click", () => {
  if (!confirm("Start a new game? This will clear everything.")) return;
  state = { players: [], turnIndex: 0, turnCount: 1, log: [] };
  saveState();
  render();
});

// ============================================================
// INIT
// ============================================================
loadState();
render();
</script>
</body>
</html>
