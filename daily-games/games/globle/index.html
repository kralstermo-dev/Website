<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globle | Daily Games</title>
<link rel="stylesheet" href="../../../styles/main.css?v=14">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the library</a>
</div>

<div class="game-shell">
  <div class="game-header">
    <h1>Globle</h1>
    <p>Guess the country. Every guess plots on the map by how close it is - no guess limit.</p>
  </div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>

  <div id="globle-map" class="globle-map"></div>
  <div id="attempts-left" class="attempts-left"></div>

  <form id="guess-form" class="guess-form" autocomplete="off">
    <div class="autocomplete">
      <input
        id="guess-input"
        type="text"
        placeholder="Choose a country"
        autocomplete="off"
        required>
      <div id="autocomplete-list" class="autocomplete-list hidden"></div>
    </div>
    <button type="submit">Guess</button>
    <button id="play-again" type="button" class="play-again">Play random</button>
  </form>

  <div id="guess-list" class="guess-list"></div>
</div>

<script src="../flagle/countries.js?v=14"></script>
<script src="game.js?v=14"></script>
</body>
</html>
