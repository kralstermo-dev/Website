<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cutle | Daily Games</title>
<link rel="stylesheet" href="../../../styles/main.css?v=11">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the library</a>
</div>

<div class="game-shell">
  <div class="game-header">
    <h1>Cutle</h1>
    <p>Drag a straight line across the shape to slice it exactly in half. 5 tries.</p>
  </div>

  <div id="status" class="status-msg" role="status" aria-live="polite">Drag across the shape to make your cut</div>

  <div id="cutle-diagram" class="cutle-diagram"></div>
  <div id="attempts-left" class="attempts-left"></div>

  <div class="cutle-actions">
    <button id="play-again" type="button" class="play-again">Play random</button>
  </div>

  <div id="guess-list" class="guess-list"></div>
</div>

<script src="game.js?v=4"></script>
</body>
</html>
