<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorfle | Daily Games</title>
<link rel="stylesheet" href="../../../styles/main.css?v=10">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the library</a>
</div>

<div class="game-shell">
  <div class="game-header">
    <h1>Colorfle</h1>
    <p id="mode-desc">Pick which 3 colors go in the Small/Medium/Large slots to match the mix.</p>
  </div>

  <div class="mode-select" id="mode-select" role="tablist" aria-label="Colorfle mode"></div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>
  <div id="attempts-left" class="attempts-left"></div>

  <!-- MIX MODE (Normal / Hard) -->
  <div id="mix-ui">
    <div id="mix-swatch" class="cf-main-swatch"></div>

    <div id="mix-slots" class="mix-slots"></div>
    <div class="mix-actions">
      <button id="mix-guess-btn" type="button" class="mix-guess-btn" disabled>Guess</button>
      <button type="button" class="play-again">Play random</button>
    </div>

    <div id="mix-palette" class="mix-palette"></div>

    <div id="mix-guess-list" class="guess-list"></div>
  </div>

  <!-- HEX MODE (Impossible) -->
  <div id="hex-ui" class="hidden">
    <div id="hex-swatch" class="cf-main-swatch"></div>
    <div id="hex-swatch-hex" class="cf-main-hex">?  ?  ?  ?  ?  ?</div>

    <form id="hex-guess-form" class="guess-form">
      <div class="autocomplete">
        <input
          id="hex-guess-input"
          type="text"
          placeholder="e.g. 3fae02"
          maxlength="7"
          autocomplete="off"
          required>
      </div>
      <button type="submit">Guess</button>
      <button type="button" class="play-again">Play random</button>
    </form>

    <div id="hex-guess-list" class="guess-list"></div>
  </div>
</div>

<script src="game.js?v=10"></script>
</body>
</html>
