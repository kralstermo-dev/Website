<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections | Daily Games</title>
<link rel="stylesheet" href="../../../styles/main.css?v=13">
</head>
<body>

<div class="wrap">
  <a class="back-link" href="../../index.html">&larr; back to the library</a>
</div>

<div class="game-shell">
  <div class="game-header">
    <h1>Connections</h1>
    <p>Find the four groups of four related words. 4 mistakes allowed.</p>
  </div>

  <div id="status" class="status-msg" role="status" aria-live="polite"></div>

  <div id="conn-solved" class="conn-solved"></div>
  <div id="conn-grid" class="conn-grid"></div>
  <div id="conn-mistakes" class="conn-mistakes"></div>

  <div class="conn-actions">
    <button id="conn-shuffle" type="button" class="conn-btn">Shuffle</button>
    <button id="conn-deselect" type="button" class="conn-btn">Deselect all</button>
    <button id="conn-submit" type="button" class="conn-btn primary">Submit</button>
  </div>

  <div class="conn-end-actions">
    <button id="play-again" type="button" class="play-again">Play random</button>
  </div>
</div>

<script src="puzzles.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
